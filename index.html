<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>澄詞｜あゆあん台湾華語</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>澄詞｜あゆあん台湾華語</h1>
    <p>忘れやすい単語を、少しずつ澄ませていくノート</p>
  </header>

  <main>
    <section class="panel">
      <h2 class="section-title">🌱 今天的3個單字</h2>
      <div class="button-row">
        <button onclick="pickWords()">今日の3單字を出す</button>
        <button class="secondary" onclick="clearTodayWords()">消す</button>
      </div>
      <p class="hint">サイトを開いた時にも自動で3語出ます。</p>
      <div id="todayWords" class="cards result-area"></div>
    </section>

    <section class="panel">
      <h2 class="section-title">🔍 單字搜尋</h2>
      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          placeholder="例：剛好 / ㄍㄤ / ちょうど / 等一下 / ゲーム"
          oninput="searchWords()"
        />
      </div>
      <p class="hint">単語・注音・意味・例文・メモ・カテゴリから検索できます。</p>
      <div id="searchResults" class="cards result-area"></div>
    </section>

    <section class="panel">
      <h2 class="section-title">📘 單字一覧</h2>
      <div class="button-row category-buttons" id="categoryButtons"></div>
      <div id="wordList" class="cards"></div>
    </section>
  </main>

  <footer>
    Ver.0.8｜CSS・JS分離｜あゆあん台湾華語ノート
  </footer>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
