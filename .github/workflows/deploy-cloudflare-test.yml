name: Deploy Chengci test branch

# Adding this workflow to the approved feature branch starts a public test deploy.
# Main, pull requests, tags and manual dispatches are deliberately not triggers.
on:
  push:
    branches:
      - codex/chengci-6-10-offline-sync

permissions:
  contents: read

# Do not interrupt an in-flight deployment. The newest pending run follows it.
concurrency:
  group: chengci-cloudflare-test
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: github.repository == 'ayuan-tw/taiwan-chinese' && github.event_name == 'push' && github.ref == 'refs/heads/codex/chengci-6-10-offline-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the tested Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Run all local tests
        run: node --test tests/*.test.cjs cloudflare/tests/*.test.mjs
      - name: Build only public application assets
        run: node cloudflare/build-assets.mjs
      - name: Install the pinned deployment tool without credentials
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.147.0
          node -e "if (require('wrangler/package.json').version !== '4.147.0') process.exit(1)"
          npx --no-install wrangler --version
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify destination and current branch tip
        env:
          TARGET_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "$TARGET_ACCOUNT_ID" != 'e7c5c29b203d1203dc9f326455a5254f' ]]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID to the approved Cloudflare account in repository variables.'
            exit 1
          fi
          current_head="$(git ls-remote --exit-code https://github.com/ayuan-tw/taiwan-chinese.git refs/heads/codex/chengci-6-10-offline-sync | cut -f1)"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo '::error::This commit is no longer the feature branch tip. Refusing a stale deployment.'
            exit 1
          fi
      - name: Deploy the public test app
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: npm
          command: deploy --config cloudflare/wrangler.jsonc --keep-vars
        env:
          WRANGLER_SEND_METRICS: 'false'
          npm_config_ignore_scripts: 'true'
          npm_config_offline: 'true'
